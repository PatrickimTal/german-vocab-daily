name: Daily vocab update

# GitHub Actions cron is UTC-only and NOT reliably on-time -- scheduled
# triggers here have been observed landing 1-3+ hours late under queue
# congestion, so a narrow "must be within N minutes of local midnight"
# gate silently rejects every real firing. Instead: schedule twice
# (roughly covering CEST and CET) as redundancy against a dropped/very
# late trigger, and gate on whether today.json's stored date already
# matches today's Europe/Berlin date -- whichever trigger lands first
# each day does the work; any later trigger that day (on time or not)
# sees it's already done and no-ops. Self-healing regardless of delay.
on:
  schedule:
    - cron: '1 22 * * *'
    - cron: '1 23 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run now even if today was already generated'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4

      - name: Check if today was already generated
        id: gate
        run: |
          today="$(date +%Y-%m-%d)"
          stored="$(python3 -c "import json; print(json.load(open('today.json'))['date'])" 2>/dev/null || echo none)"
          echo "Berlin date: $today -- today.json date: $stored"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$stored" = "$today" ]; then
            echo "Already generated today, skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install anthropic

      - name: Select today's vocabulary
        if: steps.gate.outputs.run == 'true'
        run: python3 select_daily.py

      - name: Generate site
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 generate.py

      - name: Commit and push
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily vocab update: $(date +%Y-%m-%d)"
            git push
          fi
